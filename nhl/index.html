<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Game Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.4;
        }

        @media (max-width: 479px) {
            body {
                padding: 8px;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 479px) {
            header {
                margin-bottom: 12px;
                padding: 10px;
                border-radius: 6px;
            }
        }

        h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 479px) {
            h1 {
                font-size: 1.4em;
                margin-bottom: 8px;
            }
        }

        .date-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 479px) {
            .date-selector {
                gap: 6px;
                margin-top: 8px;
            }
        }

        .date-selector button {
            background: #666;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        @media (max-width: 479px) {
            .date-selector button {
                padding: 6px 12px;
                font-size: 0.85em;
            }
        }

        .date-selector button:hover {
            background: #888;
        }

        .date-selector input[type="date"] {
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 1em;
        }

        @media (max-width: 479px) {
            .date-selector input[type="date"] {
                padding: 6px;
                font-size: 0.85em;
            }
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #888;
        }

        .games-container {
            display: grid;
            gap: 15px;
        }

        @media (max-width: 479px) {
            .games-container {
                gap: 8px;
            }
        }

        .game-card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        @media (max-width: 479px) {
            .game-card {
                border-radius: 6px;
                padding: 8px;
            }
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .game-info {
            display: flex;
            flex-direction: column;
        }

        .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        @media (max-width: 479px) {
            .button-group {
                gap: 4px;
                margin-top: 8px;
                padding-top: 8px;
            }
        }

        @media (min-width: 900px) {
            .game-info {
                flex-direction: row;
                align-items: center;
                gap: 30px;
            }

            .matchup {
                flex: 1;
            }

            .button-group {
                flex-shrink: 0;
                margin-top: 0;
                padding-top: 0;
                border-top: none;
                border-left: 1px solid #333;
                padding-left: 20px;
                flex-direction: column;
                justify-content: center;
            }

            .game-header {
                display: none;
            }
        }

        .game-status {
            font-size: 0.9em;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
        }

        @media (max-width: 479px) {
            .game-status {
                font-size: 0.65em;
                padding: 3px 6px;
            }
        }

        .status-live {
            background: #ff4444;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-final {
            background: #333;
            color: #888;
        }

        .status-scheduled {
            background: #666;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .matchup {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 0;
        }

        @media (max-width: 479px) {
            .matchup {
                gap: 6px;
            }
        }
        .score-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .status-container {
            text-align: center;
        }
        .score-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .status-container {
            text-align: center;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 0.3rem;
        }

        @media (max-width: 479px) {
            .team {
                gap: 4px;
            }
        }

        .team.away {
            justify-content: flex-end;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
       
        @media (max-width: 479px) {
            .team-logo {
                width: 32px;
                height: 32px;
            }
        }

        .team-info {
            text-align: left;
        }

        .team.away .team-info {
            text-align: right;
        }

        .team-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
        }

        @media (max-width: 479px) {
            .team-name {
                font-size: 0.9em;
            }
        }

        .team-record {
            font-size: 0.85em;
            color: #888;
        }

        @media (max-width: 479px) {
            .team-record {
                font-size: 0.65em;
            }
        }

        .score {
            font-size: 3em;
            font-weight: bold;
            color: #fff;
            min-width: 50px;
            text-align: center;
        }

        @media (max-width: 479px) {
            .score {
                font-size: 1.8em;
                min-width: 30px;
            }
        }

        .score-divider {
            font-size: 2em;
            color: #666;
        }

        @media (max-width: 479px) {
            .score-divider {
                font-size: 1.3em;
            }
        }

        @media (max-width: 479px) {
            .score-divider {
                font-size: 1.3em;
            }
        }

        .game-details {
            background: #0f0f0f;
            border-radius: 5px;
            padding: 12px;
            margin-top: 10px;
        }

        @media (max-width: 479px) {
            .game-details {
                padding: 6px;
                margin-top: 6px;
            }
        }

        .period-header {
            font-size: 0.95em;
            font-weight: bold;
            color: #979797;
            text-transform: uppercase;
            margin-bottom: 8px;
            margin-top: 14px;
            padding-bottom: 5px;
            border-bottom: 1px solid #222;
        }

        @media (max-width: 479px) {
            .period-header {
                font-size: 0.75em;
                margin-bottom: 4px;
                margin-top: 8px;
            }
        }

        .goal {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.9em;
            display: grid;
            grid-template-columns: auto max-content;
        }

        @media (max-width: 479px) {
            .goal {
                padding: 3px 0;
                font-size: 0.7em;
            }
        }

        .goal:last-child {
            border-bottom: none;
        }

        .goal-time {
            color: #bbb;
            font-weight: bold;
            display: inline-block;
            min-width: 45px;
        }

        @media (max-width: 479px) {
            .goal-time {
                min-width: 30px;
            }
        }

        .goal-team-with-logo {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 8px;
        }

        @media (max-width: 479px) {
            .goal-team-with-logo {
                gap: 3px;
                margin-right: 4px;
            }
        }

        .goal-team {
            display: inline-block;
            min-width: 35px;
            font-weight: bold;
        }

        @media (max-width: 479px) {
            .goal-team {
                min-width: 25px;
            }
        }

        .goal-team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        @media (max-width: 479px) {
            .goal-team-logo {
                width: 18px;
                height: 18px;
            }
        }

        .goal-score {
            color: #bbb;
            font-weight: bold;
            font-size: 0.95em;
            margin-right: 8px;
            display: inline-block;
            min-width: 28px;
        }

        @media (max-width: 479px) {
            .goal-score {
                min-width: 20px;
                margin-right: 4px;
            }
        }

        .goal-scorer {
            color: #fff;
            font-weight: bold;
        }

        .goal-type {
            color: #d6d6d6;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 6px;
            background: #cc0000;
            padding: 2px 6px;
            border-radius: 3px;
        }

        @media (max-width: 479px) {
            .goal-type {
                margin-left: 3px;
                padding: 1px 4px;
            }
        }

        .goal-assists {
            color: #888;
            font-size: 0.9em;
        }

        @media (max-width: 479px) {
            .goal-assists {
                display: block;
                margin-left: 34px;
                margin-top: 2px;
            }
        }

        .goal-strength {
            color: #ff8800;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 8px;
        }

        @media (max-width: 479px) {
            .goal-strength {
                margin-left: 4px;
            }
        }

        .goal-video-btn {
            background: #494949;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            margin-left: 10px;
            transition: background 0.3s;
        }

        @media (max-width: 479px) {
            .goal-video-btn {
                padding: 2px 6px;
                margin-left: 4px;
            }
        }

        .goal-video-btn:hover {
            background: #ff0000;
        }

        .video-button {
            background: #cc0000;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.3s;
        }

        @media (max-width: 479px) {
            .video-button {
                padding: 5px 8px;
                font-size: 0.7em;
                gap: 3px;
            }
        }

        .video-button:hover {
            background: #ff0000;
        }

        .video-button::before {
            content: '▶';
            font-size: 1.1em;
        }

        .no-games {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #cc0000;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: center;
        }

        .game-time {
            color: #888;
            font-size: 0.9em;
        }

        .game-venue {
            color: #666;
            font-size: 0.85em;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏒 NHL Game Results</h1>
            <div class="date-selector">
                <button onclick="changeDate(-1)">←</button>
                <input type="date" id="datePicker" onchange="loadGames()">
                <button onclick="changeDate(1)">→</button>
                <button onclick="loadToday()">Today</button>
            </div>
        </header>

        <div id="loading">Loading games...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="games" class="games-container"></div>
    </div>

    <script>
        let currentDate = new Date();

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function initDate() {
            const datePicker = document.getElementById('datePicker');
            datePicker.value = formatDate(currentDate);
            datePicker.max = formatDate(new Date());
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            document.getElementById('datePicker').value = formatDate(currentDate);
            loadGames();
        }

        function loadToday() {
            currentDate = new Date();
            document.getElementById('datePicker').value = formatDate(currentDate);
            loadGames();
        }

        async function loadGames() {
            const dateStr = document.getElementById('datePicker').value;
            currentDate = new Date(dateStr + 'T12:00:00');
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('games').innerHTML = '';

            try {
                const apiDate = dateStr;
                const apiUrl = `https://api-web.nhle.com/v1/score/${apiDate}`;
                const response = await fetch(`https://purple-river-9e8e.mikko-vesikkala.workers.dev?url=${encodeURIComponent(apiUrl)}`);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                displayGames(data);
            } catch (error) {
                console.error('Error fetching games:', error);
                document.getElementById('error').textContent = `Error loading games: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayGames(data) {
            const gamesContainer = document.getElementById('games');
            
            if (!data.games || data.games.length === 0) {
                gamesContainer.innerHTML = '<div class="no-games">No games scheduled for this date</div>';
                return;
            }

            data.games.forEach(game => {
                const gameCard = createGameCard(game);
                gamesContainer.appendChild(gameCard);
            });
        }

        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';

            const awayTeam = game.awayTeam;
            const homeTeam = game.homeTeam;
            
            let statusClass = 'status-scheduled';
            let statusText = formatGameTime(game.startTimeUTC);
            
            if (game.gameState === 'FUT' || game.gameState === 'PRE') {
                statusClass = 'status-scheduled';
            } else if (game.gameState === 'LIVE' || game.gameState === 'CRIT') {
                statusClass = 'status-live';
                statusText = `LIVE - ${game.periodDescriptor?.periodType || ''} ${game.clock?.timeRemaining || ''}`;
            } else if (game.gameState === 'OFF' || game.gameState === 'FINAL') {
                statusClass = 'status-final';
                statusText = game.periodDescriptor?.periodType === 'OT' ? 'FINAL/OT' : 
                           game.periodDescriptor?.periodType === 'SO' ? 'FINAL/SO' : 'FINAL';
            }

            // Create gamecenter URL
            const gameDate = new Date(game.startTimeUTC);
            const year = gameDate.getFullYear();
            const month = String(gameDate.getMonth() + 1).padStart(2, '0');
            const day = String(gameDate.getDate()).padStart(2, '0');
            const gamecenterUrl = `https://www.nhl.com/gamecenter/${awayTeam.abbrev.toLowerCase()}-vs-${homeTeam.abbrev.toLowerCase()}/${year}/${month}/${day}/${game.id}`;
            
            // Fix video URL if it's a relative path
            const videoUrl = game.threeMinRecap || game.condensedGame || game.gameVideo;
            const fullVideoUrl = videoUrl ? (videoUrl.startsWith('http') ? videoUrl : `https://www.nhl.com${videoUrl}`) : null;

            card.innerHTML = `
                <div class="game-info">
                    <div class="matchup">
                        <div class="team away">
                            <div class="team-info">
                                <div class="team-name">${awayTeam.abbrev}</div>
                                <div class="team-record">${awayTeam.record || ''}</div>
                            </div>
                            <img class="team-logo" src="https://assets.nhle.com/logos/nhl/svg/${awayTeam.abbrev}_light.svg" 
                                 alt="${awayTeam.abbrev}" onerror="this.style.display='none'">
                        </div>
                        
                        <div class="score-section">
                            <div>
                                <span class="score">${awayTeam.score || 0}</span>
                                <span class="score-divider">-</span>
                                <span class="score">${homeTeam.score || 0}</span>
                            </div>
                            <div class="status-container">
                                <span class="game-status ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        
                        <div class="team home">
                            <img class="team-logo" src="https://assets.nhle.com/logos/nhl/svg/${homeTeam.abbrev}_light.svg" 
                                 alt="${homeTeam.abbrev}" onerror="this.style.display='none'">
                            <div class="team-info">
                                <div class="team-name">${homeTeam.abbrev}</div>
                                <div class="team-record">${homeTeam.record || ''}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="button-group">
                        <button class="video-button" onclick="window.open('${gamecenterUrl}', '_blank')" style="background: #555;">NHL.com</button>
                        ${fullVideoUrl ? `<button class="video-button" onclick="window.open('${fullVideoUrl}', '_blank')">Highlights</button>` : ''}
                    </div>
                </div>
                
                <div id="details-${game.id}"></div>
            `;

            // Load detailed game data if game has started
            if (game.gameState !== 'FUT' && game.gameState !== 'PRE') {
                loadGameDetails(game.id);
            }

            return card;
        }

        async function loadGameDetails(gameId) {
            try {
                const apiUrl = `https://api-web.nhle.com/v1/gamecenter/${gameId}/play-by-play`;
                const response = await fetch(`https://purple-river-9e8e.mikko-vesikkala.workers.dev?url=${encodeURIComponent(apiUrl)}`);
                if (!response.ok) return;

                const data = await response.json();
                displayGameDetails(gameId, data);
            } catch (error) {
                console.error(`Error loading details for game ${gameId}:`, error);
            }
        }

        function displayGameDetails(gameId, data) {
            const detailsContainer = document.getElementById(`details-${gameId}`);
            if (!detailsContainer) return;

            const plays = data.plays || [];
            const goals = plays.filter(play => 
                play.typeDescKey === 'goal' && 
                play.details?.eventOwnerTeamId
            );

            if (goals.length === 0) return;

            // Build player lookup from rosterSpots
            const playerLookup = {};
            if (data.rosterSpots) {
                data.rosterSpots.forEach(spot => {
                    if (spot.playerId) {
                        const firstName = spot.firstName?.default || '';
                        const lastName = spot.lastName?.default || '';
                        const number = spot.sweaterNumber || '';
                        const name = `${firstName} ${lastName}`.trim();
                        playerLookup[spot.playerId] = number ? `#${number} ${name}` : name;
                    }
                });
            }

            // Group goals by period
            const goalsByPeriod = {};
            goals.forEach(goal => {
                const period = goal.periodDescriptor?.number || 1;
                if (!goalsByPeriod[period]) {
                    goalsByPeriod[period] = [];
                }
                goalsByPeriod[period].push(goal);
            });

            let html = '<div class="game-details">';
            
            Object.keys(goalsByPeriod).sort((a, b) => a - b).forEach(period => {
                const periodGoals = goalsByPeriod[period];
                const periodName = period == 4 ? 'OT' : period == 5 ? 'SO' : `Period ${period}`;
                
                html += `<div class="period-header">${periodName}</div>`;
                
                periodGoals.forEach(goal => {
                    const teamAbbrev = goal.details.eventOwnerTeamId;
                    const time = goal.timeInPeriod || '';
                    
                    // Get player names from lookup
                    const scorer = playerLookup[goal.details.scoringPlayerId] || 'Unknown';
                    const assists = [];
                    
                    if (goal.details.assist1PlayerId && playerLookup[goal.details.assist1PlayerId]) {
                        assists.push(playerLookup[goal.details.assist1PlayerId]);
                    }
                    
                    if (goal.details.assist2PlayerId && playerLookup[goal.details.assist2PlayerId]) {
                        assists.push(playerLookup[goal.details.assist2PlayerId]);
                    }
                    
                    const assistText = assists.length > 0 ? ` (${assists.join(', ')})` : '';
                    const strength = goal.details.goalModifier ? 
                        `<span class="goal-strength">${goal.details.goalModifier}</span>` : '';
                    
                    // Score after this goal (awayScore-homeScore)
                    const score = `${goal.details.awayScore || 0}-${goal.details.homeScore || 0}`;
                    
                    // Check for special goal types (PPG, EN, SHG)
                    let goalType = '';
                    
                    // Check for empty net first
                    const isEmptyNet = !goal.details.goalieInNetId || goal.details.goalieInNetId === 0;
                    
                    if (isEmptyNet) {
                        goalType = '<span class="goal-type">EN</span>';
                    } else {
                        // Only check for PPG/SHG if there's a goalie (not empty net)
                        // situationCode format: XYZW - X=away goalie(1/0), Y=away skaters, Z=home skaters, W=home goalie(1/0)
                        const situation = goal.situationCode || '';
                        if (situation.length === 4) {
                            const awayGoalie = situation.charAt(0);
                            const awaySkaters = parseInt(situation.charAt(1));
                            const homeSkaters = parseInt(situation.charAt(2));
                            const homeGoalie = situation.charAt(3);
                            
                            // Only mark as PPG/SHG if BOTH goalies are in net (not pulled for extra attacker)
                            // and skater counts are different (not even strength)
                            if (awayGoalie === '1' && homeGoalie === '1' && awaySkaters !== homeSkaters) {
                                // Determine which team scored
                                const scoringTeamIsHome = goal.details.eventOwnerTeamId === data.homeTeam?.id;
                                
                                if (scoringTeamIsHome && homeSkaters > awaySkaters) {
                                    goalType = '<span class="goal-type">PPG</span>';
                                } else if (!scoringTeamIsHome && awaySkaters > homeSkaters) {
                                    goalType = '<span class="goal-type">PPG</span>';
                                } else if (scoringTeamIsHome && homeSkaters < awaySkaters) {
                                    goalType = '<span class="goal-type">SHG</span>';
                                } else if (!scoringTeamIsHome && awaySkaters < homeSkaters) {
                                    goalType = '<span class="goal-type">SHG</span>';
                                }
                            }
                        }
                    }
                    
                    // Video link for the goal
                    const videoUrl = goal.details.highlightClipSharingUrl;
                    const videoButton = videoUrl ? `<button class="goal-video-btn" onclick="window.open('${videoUrl}', '_blank')" title="Watch goal video">▶</button>` : '';
                    
                    // Get team abbreviation
                    const teamAbbrevText = getTeamAbbrev(teamAbbrev, data);
                    
                    html += `
                        <div class="goal">
                            <div>
                            <span class="goal-time">${time}</span>
                            <span class="goal-score">${score}</span>
                            <span class="goal-team-with-logo">
                                <span class="goal-team">${teamAbbrevText}</span>
                                <img class="goal-team-logo" src="https://assets.nhle.com/logos/nhl/svg/${teamAbbrevText}_light.svg" alt="${teamAbbrevText}" onerror="this.style.display='none'">
                            </span>
                            <span class="goal-scorer">${scorer}</span>
                            ${goalType}
                            <span class="goal-assists">${assistText}</span>
                            ${strength}
                            </div>
                            <div>${videoButton}</div>
                        </div>
                    `;
                });
            });
            
            html += '</div>';
            detailsContainer.innerHTML = html;
        }

        function getTeamAbbrev(teamId, data) {
            if (data.awayTeam?.id === teamId) return data.awayTeam.abbrev;
            if (data.homeTeam?.id === teamId) return data.homeTeam.abbrev;
            return '';
        }

        function formatGameTime(utcTime) {
            if (!utcTime) return 'TBD';
            const date = new Date(utcTime);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Initialize on load
        initDate();
        loadGames();

        // Auto-refresh every 30 seconds for live games
        setInterval(() => {
            const liveGames = document.querySelectorAll('.status-live');
            if (liveGames.length > 0) {
                loadGames();
            }
        }, 30000);
    </script>
</body>
</html>
